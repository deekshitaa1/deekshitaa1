<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
<title id="title">The SDE climb — animated snake and ladder</title>
<desc id="desc">A blush pink, chocolate and wine-red isometric engineering game board with animated player token and glowing ladders.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#24131d"/><stop offset=".55" stop-color="#51263b"/><stop offset="1" stop-color="#21121b"/></linearGradient>
  <linearGradient id="tile" x2="0" y2="1"><stop stop-color="#9d5875"/><stop offset="1" stop-color="#55283e"/></linearGradient>
  <linearGradient id="gold" x2="0" y2="1"><stop stop-color="#fff0c9"/><stop offset="1" stop-color="#d4a45f"/></linearGradient>
  <linearGradient id="pink" x2="0" y2="1"><stop stop-color="#ffd7e5"/><stop offset="1" stop-color="#d8759b"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="shadow"><feGaussianBlur stdDeviation="9"/></filter>
  <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#e9a9c1" stroke-opacity=".09"/></pattern>
</defs>
<rect width="1000" height="430" rx="24" fill="url(#bg)"/>
<rect width="1000" height="430" rx="24" fill="url(#grid)"/>
<ellipse cx="520" cy="360" rx="390" ry="38" fill="#09060a" opacity=".55" filter="url(#shadow)"/>
<text x="42" y="52" fill="#ffe1eb" font-family="monospace" font-size="25" font-weight="bold" letter-spacing="2">THE SDE CLIMB</text>
<text x="44" y="77" fill="#dcb2c2" font-family="monospace" font-size="11" letter-spacing="1.5">SNAKES, LADDERS &amp; QUESTIONABLE PRODUCTION DEPLOYS</text>
<!-- 3D board base -->
<path d="M190 125 L800 125 L890 340 L280 340 Z" fill="#170d14" opacity=".9" stroke="#d58aa7" stroke-width="3"/>
<path d="M190 125 L800 125 L890 340 L280 340 Z" fill="url(#tile)" opacity=".22"/>
<!-- board grid -->
<g stroke="#e6b0c5" stroke-opacity=".52" stroke-width="1.3">
<path d="M190 125L280 340 M251 125L341 340 M312 125L402 340 M373 125L463 340 M434 125L524 340 M495 125L585 340 M556 125L646 340 M617 125L707 340 M678 125L768 340 M739 125L829 340 M800 125L890 340"/>
<path d="M190 125H800 M208 168H818 M226 211H836 M244 254H854 M262 297H872 M280 340H890"/>
</g>
<!-- tiles and numbered milestones -->
<g fill="#f7dce6" font-family="monospace" font-size="11" font-weight="bold">
<text x="208" y="151">01</text><text x="269" y="151">02</text><text x="330" y="151">03</text><text x="391" y="151">04</text><text x="452" y="151">05</text><text x="513" y="151">06</text><text x="574" y="151">07</text><text x="635" y="151">08</text><text x="696" y="151">09</text><text x="757" y="151">10</text>
<text x="226" y="194">20</text><text x="287" y="194">19</text><text x="348" y="194">18</text><text x="409" y="194">17</text><text x="470" y="194">16</text><text x="531" y="194">15</text><text x="592" y="194">14</text><text x="653" y="194">13</text><text x="714" y="194">12</text><text x="775" y="194">11</text>
<text x="244" y="237">21</text><text x="305" y="237">22</text><text x="366" y="237">23</text><text x="427" y="237">24</text><text x="488" y="237">25</text><text x="549" y="237">26</text><text x="610" y="237">27</text><text x="671" y="237">28</text><text x="732" y="237">29</text><text x="793" y="237">30</text>
<text x="262" y="280">40</text><text x="323" y="280">39</text><text x="384" y="280">38</text><text x="445" y="280">37</text><text x="506" y="280">36</text><text x="567" y="280">35</text><text x="628" y="280">34</text><text x="689" y="280">33</text><text x="750" y="280">32</text><text x="811" y="280">31</text>
</g>
<!-- ladder rails -->
<g stroke="url(#gold)" stroke-width="7" stroke-linecap="round" filter="url(#glow)">
<path d="M350 316L500 184 M373 326L523 194 M650 296L760 160 M673 306L783 170"/>
</g>
<g stroke="#fff0cc" stroke-width="3">
<path d="M365 303L388 313 M390 281L413 291 M416 258L439 268 M441 236L464 246 M466 214L489 224 M678 281L701 291 M700 258L723 268 M722 235L745 245 M744 212L767 222 M766 189L789 199"/>
</g>
<!-- cheeky snake body -->
<path d="M805 151 C865 174 845 214 790 219 S700 245 735 279 S820 314 780 337" fill="none" stroke="#3b1429" stroke-width="23" stroke-linecap="round"/>
<path d="M805 151 C865 174 845 214 790 219 S700 245 735 279 S820 314 780 337" fill="none" stroke="#ef9bb8" stroke-width="13" stroke-linecap="round"/>
<circle cx="805" cy="151" r="17" fill="#ffc6d9" stroke="#fff0f4" stroke-width="3"/>
<circle cx="800" cy="147" r="2.8" fill="#45162d"/><circle cx="811" cy="147" r="2.8" fill="#45162d"/>
<path d="M805 158l-5 8m5-8l5 8" stroke="#fff0f4" stroke-width="2"/>
<!-- moving player token -->
<g filter="url(#glow)">
<circle r="14" fill="url(#gold)" stroke="#fff5d9" stroke-width="3">
<animateMotion dur="8s" repeatCount="indefinite" path="M210 145 L760 145 L815 188 L265 188 L320 231 L870 231 L835 274 L285 274 L340 317 L860 317"/>
</circle>
</g>
<!-- left HUD -->
<rect x="38" y="125" width="125" height="225" rx="14" fill="#3a1c2b" stroke="#c77b99" stroke-width="1.5"/>
<text x="57" y="155" fill="#eab8cb" font-family="monospace" font-size="11">PLAYER CLASS</text>
<text x="57" y="188" fill="#fff0f5" font-family="monospace" font-size="25" font-weight="bold">SDE</text>
<path d="M57 205H143" stroke="#9e607a"/>
<text x="57" y="232" fill="#eab8cb" font-family="monospace" font-size="11">XP GAINED</text>
<text x="57" y="263" fill="#fff0f5" font-family="monospace" font-size="24">+∞</text>
<text x="57" y="302" fill="#eab8cb" font-family="monospace" font-size="11">OPEN BUGS</text>
<text x="57" y="327" fill="#f5c39e" font-family="monospace" font-size="21">also ∞</text>
<!-- right captions -->
<rect x="902" y="126" width="75" height="224" rx="12" fill="#3a1c2b" stroke="#c77b99"/>
<text x="914" y="158" fill="#ffe0e9" font-family="monospace" font-size="10" transform="rotate(90 914 158)">SHIP IT</text>
<text x="914" y="250" fill="#f5c39e" font-family="monospace" font-size="10" transform="rotate(90 914 250)">NOT A BUG?</text>
<text x="43" y="397" fill="#ffe1eb" font-family="monospace" font-size="13" font-weight="bold">LADDER: TESTS PASS → DEPLOY</text>
<text x="555" y="397" fill="#f2c39f" font-family="monospace" font-size="13" font-weight="bold">SNAKE: WORKS ON MY MACHINE</text>
<text x="43" y="417" fill="#c99bad" font-family="monospace" font-size="9">ROLL THE DICE · SOLVE THE BUG · CLIMB THE LADDER · REPEAT</text>
</svg>